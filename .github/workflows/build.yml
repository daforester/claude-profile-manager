name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: darwin
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Linux GUI dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: go test ./internal/...

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      # --release already adds -s -w -trimpath. no_emoji drops Fyne's 4 MB
      # bundled emoji font (the UI uses none), -Os shrinks the cgo code, and
      # fyne lifts -ldflags out of GOFLAGS to stamp the version.
      - name: Package GUI
        shell: bash
        env:
          CGO_CFLAGS: "-Os"
        run: |
          VERSION=$(git describe --tags --always)
          APPVER=$(echo "$VERSION" | sed -E 's/^v//; s/-.*$//')
          [[ "$APPVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || APPVER=0.1.0
          export GOFLAGS="-ldflags=-X=claude-profile-manager/internal/cli.Version=$VERSION"
          fyne package --release --target ${{ matrix.target }} --tags no_emoji --app-version "$APPVER" --name "Claude Profile Manager"
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows) mv "Claude Profile Manager.exe" dist/claude-profile-manager.exe ;;
            darwin)  ditto -c -k --keepParent "Claude Profile Manager.app" dist/claude-profile-manager-macos.zip ;;
            linux)   mv *.tar.xz dist/claude-profile-manager-linux.tar.xz ;;
          esac

      - name: Build cpm CLI
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          EXT=""; [ "${{ matrix.target }}" = windows ] && EXT=.exe
          go build -trimpath -ldflags "-s -w -X claude-profile-manager/internal/cli.Version=$(git describe --tags --always)" -o dist/cpm-${{ matrix.target }}$EXT ./cmd/cpm

      - name: Record uncompressed sizes
        if: matrix.target == 'windows'
        shell: bash
        run: for f in dist/*.exe; do echo "$(basename "$f") $(stat -c %s "$f")"; done > exe-sizes.txt

      # UPX packs the exes into self-extracting ones (~70% smaller); they
      # unpack in memory at launch, so nothing changes for the user.
      - name: Compress Windows executables
        if: matrix.target == 'windows'
        uses: crazy-max/ghaction-upx@v3
        with:
          version: latest
          files: dist/*.exe
          args: --best --lzma

      - name: Report UPX compression
        if: matrix.target == 'windows'
        shell: bash
        run: |
          {
            echo "### UPX compression"
            echo "| File | Before | After | Saved |"
            echo "|---|---:|---:|---:|"
            while read -r name before; do
              after=$(stat -c %s "dist/$name")
              awk -v n="$name" -v b="$before" -v a="$after" 'BEGIN { printf "| %s | %.1f MB | %.1f MB | %.0f%% |\n", n, b/1048576, a/1048576, (1-a/b)*100 }'
            done < exe-sizes.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: claude-profile-manager-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
