name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: darwin
          # Linux builds in AlmaLinux 8 so the binary needs only glibc 2.28
          # and runs on every mainstream distro from 2018 on (RHEL 8,
          # Debian 10, Ubuntu 20.04, openSUSE Leap 15, ...). A build on a
          # current Ubuntu would need that Ubuntu's much newer glibc.
          - os: ubuntu-latest
            target: linux
            container: almalinux:8
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Before checkout: git is needed for the full history `git describe`
      # uses, and the rest to build the GUI (GLFW, OpenGL, X11, Wayland).
      - name: Linux build tools
        if: matrix.target == 'linux'
        run: |
          dnf -y install git gcc pkgconf-pkg-config tar xz findutils file \
            mesa-libGL-devel libX11-devel libXcursor-devel libXrandr-devel \
            libXinerama-devel libXi-devel libXxf86vm-devel wayland-devel libxkbcommon-devel

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      # VERSION stamps the binaries (e.g. v1.2.3-4-gabcdef). APPVER is the
      # numeric version installers need (1.2.3) and PKG_RELEASE counts
      # commits since that tag, so builds between releases still upgrade
      # cleanly (1.2.3-1 for the tag itself, then 1.2.3-2, ...).
      - name: Version
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          VERSION=$(git describe --tags --always)
          APPVER=$(echo "$VERSION" | sed -E 's/^v//; s/-.*$//')
          [[ "$APPVER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || APPVER=0.1.0
          if DESC=$(git describe --tags --long --match 'v*' 2>/dev/null); then
            N=$(echo "$DESC" | sed -E 's/^.*-([0-9]+)-g[0-9a-f]+$/\1/')
          else
            N=$(git rev-list --count HEAD)
          fi
          { echo "VERSION=$VERSION"; echo "APPVER=$APPVER"; echo "PKG_RELEASE=$((N + 1))"; } >> "$GITHUB_ENV"

      - name: Resolve modules
        run: go mod tidy

      - name: Test
        run: go test ./internal/...

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@latest

      # --release already adds -s -w -trimpath. no_emoji drops Fyne's 4 MB
      # bundled emoji font (the UI uses none), -Os shrinks the cgo code, and
      # fyne lifts -ldflags out of GOFLAGS to stamp the version.
      # fyne also appends -D_FORTIFY_SOURCE=3, which AlmaLinux 8's glibc
      # headers answer with a #warning (it is treated as 2), and Go builds
      # runtime/cgo with -Werror; -Wno-cpp silences that warning. Linux only:
      # clang on macOS rejects the option.
      - name: Package GUI
        shell: bash
        env:
          CGO_CFLAGS: ${{ matrix.target == 'linux' && '-Os -Wno-cpp' || '-Os' }}
        run: |
          export GOFLAGS="-ldflags=-X=claude-profile-manager/internal/cli.Version=$VERSION"
          fyne package --release --target ${{ matrix.target }} --tags no_emoji --app-version "$APPVER" --name "Claude Profile Manager"
          mkdir -p dist
          case "${{ matrix.target }}" in
            windows) mv "Claude Profile Manager.exe" dist/claude-profile-manager.exe ;;
            darwin)  scripts/macos-url-scheme.sh "Claude Profile Manager.app"
                     ditto -c -k --keepParent "Claude Profile Manager.app" dist/claude-profile-manager-macos.zip ;;
            linux)   mv *.tar.xz dist/claude-profile-manager-linux.tar.xz ;;
          esac

      - name: Build cpm CLI
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          EXT=""; [ "${{ matrix.target }}" = windows ] && EXT=.exe
          go build -trimpath -ldflags "-s -w -X claude-profile-manager/internal/cli.Version=$VERSION" -o dist/cpm-${{ matrix.target }}$EXT ./cmd/cpm

      # .deb, .rpm (Fedora, RHEL, openSUSE, ...), Arch .pkg.tar.zst and an
      # AppImage, all from the binaries built above.
      - name: Linux packages
        if: matrix.target == 'linux'
        shell: bash
        run: |
          mkdir -p stage "$RUNNER_TEMP/fyne" "$RUNNER_TEMP/bin"
          tar -xJf dist/claude-profile-manager-linux.tar.xz -C "$RUNNER_TEMP/fyne"
          install -m 755 "$(find "$RUNNER_TEMP/fyne" -path '*/bin/*' -type f | head -1)" stage/claude-profile-manager
          install -m 755 dist/cpm-linux stage/cpm
          GOBIN="$RUNNER_TEMP/bin" go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          PATH="$RUNNER_TEMP/bin:$PATH" packaging/linux/build-packages.sh "$APPVER" "$PKG_RELEASE"

      # Drag-to-Applications .dmg and an installer .pkg (which also puts
      # cpm on the PATH).
      - name: macOS installers
        if: matrix.target == 'darwin'
        run: packaging/macos/build-installers.sh "Claude Profile Manager.app" dist/cpm-darwin "$APPVER"

      - name: Record uncompressed sizes
        if: matrix.target == 'windows'
        shell: bash
        run: for f in dist/*.exe; do echo "$(basename "$f") $(stat -c %s "$f")"; done > exe-sizes.txt

      # UPX packs the exes into self-extracting ones (~70% smaller); they
      # unpack in memory at launch, so nothing changes for the user.
      - name: Compress Windows executables
        if: matrix.target == 'windows'
        uses: crazy-max/ghaction-upx@v4
        with:
          version: latest
          files: dist/*.exe
          args: --best --lzma

      - name: Report UPX compression
        if: matrix.target == 'windows'
        shell: bash
        run: |
          {
            echo "### UPX compression"
            echo "| File | Before | After | Saved |"
            echo "|---|---:|---:|---:|"
            while read -r name before; do
              after=$(stat -c %s "dist/$name")
              awk -v n="$name" -v b="$before" -v a="$after" 'BEGIN { printf "| %s | %.1f MB | %.1f MB | %.0f%% |\n", n, b/1048576, a/1048576, (1-a/b)*100 }'
            done < exe-sizes.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # MSI installer (after UPX, so it carries the compressed exes). WiX 5
      # is pinned: later versions need a licence acceptance step.
      - name: Windows installer
        if: matrix.target == 'windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$PATH:$HOME/.dotnet/tools"
          wix build packaging/windows/claude-profile-manager.wxs -arch x64 \
            -d Version="$APPVER" -d Dist=dist -o dist/claude-profile-manager-windows.msi
          rm -f dist/*.wixpdb

      - uses: actions/upload-artifact@v7
        with:
          name: claude-profile-manager-${{ matrix.target }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
